name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Format, Test & Pipeline Smoke Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and declared dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Ruff formatting checks
        run: ruff format --check .

      - name: Run automated pytest suite
        run: python -m pytest -v

      - name: Run end-to-end CLI demonstration & workbook validation
        run: |
          python -m excel_reconciliation generate-demo --output examples/input
          python -m excel_reconciliation reconcile --input examples/input --output examples/output
          python -m excel_reconciliation validate --report examples/output/reconciliation_report.xlsx
