[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "excel-reconciliation-automation"
version = "1.0.0"
description = "Automated Excel data cleaning, deterministic record matching, three-way financial reconciliation, and auditable report generation."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Corey Zhou", email = "contact@coreyzhou.com" },
]
keywords = [
    "excel",
    "reconciliation",
    "automation",
    "polars",
    "openpyxl",
    "data-cleaning",
    "accounting",
    "procurement",
    "etl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1.2,<4.0.0",
    "polars>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://coreyzhou.com"
Repository = "https://github.com/akaBoyLovesToCode/excel-reconciliation-automation"
Issues = "https://github.com/akaBoyLovesToCode/excel-reconciliation-automation/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_reconciliation"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["excel_reconciliation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
